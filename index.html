<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL2QR - 스마트하고 간편한 QR 코드 생성기</title>
  <meta name="description" content="URL을 입력하면 즉시 세련된 QR 코드를 생성하고 고화질 JPG 이미지로 다운로드할 수 있는 간편한 웹 도구입니다.">
  <meta name="keywords" content="QR코드, QR코드생성기, URL to QR, 무료 QR코드, JPG 다운로드">
  
  <!-- Favicon fallback -->
  <link rel="icon" type="image/png" href="img/logo.png">
  
  <!-- Google Fonts: Inter & Outfit & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme">
  <!-- Background Dynamic Gradient & Glow Canvas Elements -->
  <div class="bg-effects" aria-hidden="true">
    <div class="dynamic-mouse-aura" id="mouseAura"></div>
    <div class="glow-orb orb-primary"></div>
    <div class="glow-orb orb-secondary"></div>
    <div class="glow-orb orb-accent"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Main App Layout Wrapper -->
  <div class="app-layout" id="appLayout">
    
    <!-- Header with Left Logo -->
    <header class="app-header">
      <a href="#" class="brand-logo-link" id="btnLogoHome" title="처음 화면으로 돌아가기">
        <img src="img/logo.png" alt="URL2QR 로고" class="brand-logo" onerror="this.src='ing/logo.png'">
      </a>
      <div class="header-actions">
        <button type="button" class="theme-toggle-btn" id="btnThemeToggle" title="테마 변경" aria-label="테마 전환">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Content Stage -->
    <main class="main-stage">
      
      <!-- Central QR Display Area (Revealed when QR is generated) -->
      <section class="qr-display-section" id="qrDisplaySection" aria-live="polite">
        <div class="qr-card-wrapper" id="qrCardWrapper">
          <div class="qr-card" id="qrDownloadCard" role="button" tabindex="0" title="클릭하여 JPG 파일로 다운로드" aria-label="QR 코드 이미지. 클릭하면 JPG 파일로 다운로드됩니다.">
            
            <!-- QR Code Canvas Container -->
            <div class="qr-code-frame">
              <div id="qrcode" class="qrcode-canvas-holder"></div>
              
              <!-- Hover Overlay for Instant Download Feedback -->
              <div class="qr-hover-overlay">
                <div class="download-badge-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                </div>
                <span class="overlay-text">클릭하여 JPG 다운로드</span>
              </div>
            </div>

            <!-- Card Bottom Hint / Status -->
            <div class="qr-card-meta">
              <div class="download-prompt">
                <span class="pulse-dot"></span>
                <span class="prompt-label">QR 코드를 클릭하면 <strong>.JPG</strong>로 다운로드됩니다</span>
              </div>
              <p class="current-target-url" id="displayTargetUrl" title="입력된 URL"></p>
            </div>
          </div>

          <!-- Quick Actions Bar below QR Code -->
          <div class="qr-quick-actions">
            <button type="button" class="action-btn" id="btnDownloadJpg" title="JPG 파일 다운로드">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>JPG 다운로드</span>
            </button>
            <button type="button" class="action-btn" id="btnCopyImage" title="클립보드에 이미지 복사">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              <span>이미지 복사</span>
            </button>
            <button type="button" class="action-btn" id="btnReset" title="새로운 QR 코드 만들기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
              <span>새로 만들기</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Central / Bottom Floating URL Input Section -->
      <section class="url-input-section" id="urlInputSection">
        
        <!-- Welcome Hero Text (Visible in initial state, fades gracefully) -->
        <div class="hero-intro" id="heroIntro">
          <h1 class="hero-title">
            간편하고 스마트한 <span class="gradient-accent">URL QR 생성기</span>
          </h1>
          <p class="hero-subtitle">원하는 링크를 입력하면 고화질 QR 코드를 즉시 생성하고 바로 다운로드할 수 있습니다.</p>
        </div>

        <!-- The Interactive Input Box Component -->
        <form class="url-form-card" id="urlForm" onsubmit="return false;">
          <div class="input-glow-wrapper">
            <div class="input-icon-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              </svg>
            </div>
            
            <input 
              type="text" 
              id="urlInput" 
              class="url-input-field" 
              placeholder="QR 코드로 만들 URL을 입력하세요 (예: https://example.com)" 
              autocomplete="off"
              spellcheck="false"
              required
            />

            <!-- Paste / Clear Quick Action Buttons inside input -->
            <div class="input-inline-actions">
              <button type="button" class="inline-btn" id="btnClearInput" title="입력 내용 지우기" aria-label="입력 내용 지우기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
              <button type="button" class="inline-btn paste-btn" id="btnPasteInput" title="클립보드 주소 붙여넣기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                <span>붙여넣기</span>
              </button>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="btnGenerate">
              <span class="btn-text">확인</span>
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </div>
          <div class="input-hint-message" id="inputErrorMsg" role="alert"></div>
        </form>

      </section>

    </main>

    <!-- Subtle Toast Notification Container -->
    <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

    <!-- Footer -->
    <footer class="app-footer">
      <span>© 2026 URL2QR Studio • 빠르고 간편한 QR 코드 메이커</span>
    </footer>
  </div>

  <!-- QR Code Library -->
  <script src="js/qrcode.min.js"></script>
  <!-- Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>
